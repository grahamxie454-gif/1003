      <div class="tripbar">
        <select id="tripSel" aria-label="選擇行程"></select>
        <input type="text" id="tripName" maxlength="30" placeholder="行程名稱" aria-label="行程名稱">
        <button type="button" class="ib" data-trip="new" title="新增行程" aria-label="新增行程"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" class="ib" data-trip="rename" title="重新命名" aria-label="重新命名"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <button type="button" class="ib" data-trip="reset" title="清除：清除這份行程的自訂內容並重設（再按一次確認）" aria-label="清除這份行程的自訂內容並重設"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H9l-5.3-5.3a1.5 1.5 0 0 1 0-2.1l8.9-8.9a1.5 1.5 0 0 1 2.1 0l5.3 5.3a1.5 1.5 0 0 1 0 2.1L12 20"/><path d="M8 11l6 6"/></svg></button>
        <button type="button" class="ib danger" data-trip="del" title="刪除這份行程（再按一次確認）" aria-label="刪除行程"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></button>
        <span class="status" id="saveSt"></span>
      </div>
      <div class="grid">
        <form class="panel" id="f" onsubmit="return false">
          <fieldset class="flt"><legend>1. 航班（可多段，依序接續）</legend><div id="flights"></div></fieldset>
          <fieldset>
            <legend>2. 旅遊天數（由航班日期自動計算）</legend>
            <input type="hidden" id="days" value="5"><output id="daysOut" class="daysout">尚未計算</output>
            <p class="hint" id="daysHint">填入航班後，天數會自動計算。</p>
          </fieldset>
          <fieldset>
            <legend>3. 交通工具（可複選）</legend>
            <div class="chips" id="modes"></div>
            <p class="hint">選了自駕又選其他工具時，可在每天自行勾選當天是否自駕；只選自駕時，每天都會自動勾選。</p>
          </fieldset>
          <fieldset><legend>4. 預算等級</legend><div class="chips" id="tier"></div></fieldset>
          <fieldset><legend>5. 行程步調</legend><div class="chips" id="pace"></div></fieldset>
          <div class="expandbox"><button type="button" id="expandBtn" disabled>展開行程</button><p class="hint" id="expandMsg">請先設定航班。</p></div>
          <fieldset id="cityBox" hidden>
            <legend>6. 城市（國家依航班抵達順序排列，不能調整）</legend>
            <div class="chips" id="ci"></div>
            <div id="order"></div>
            <details class="adder"><summary>＋ 自訂國家／城市</summary><div id="adder"></div></details>
          </fieldset>
        </form>
        <main aria-live="polite">
          <div class="pickbar" id="pickbar" hidden><input type="search" id="pickQ" placeholder="搜尋景點：名稱、地區、類型或子分類（例如：拉麵、寺廟、博多）" aria-label="搜尋景點" autocomplete="off"><span class="muted" id="pickQn"></span></div>
          <div id="pick"></div>
          <div id="res"></div>
        </main>
      </div>
