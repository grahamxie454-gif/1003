<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>照片幻燈片</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="slidebody">
<div class="wrap" id="loginWrap">
  <header>
    <h1>照片幻燈片</h1>
    <p>請先登入已註冊的帳號，才能瀏覽照片。</p>
  </header>
  <p class="msg" id="boot">載入中…</p>
  <section id="auth" class="card" hidden></section>
</div>
<div id="app" class="slides" hidden>
  <div class="menuwrap slmenu">
    <button type="button" class="menubtn" id="menuBtn" aria-label="開啟選單" aria-haspopup="true" aria-expanded="false"><span></span><span></span><span></span></button>
    <nav class="menupop" id="menuPop" hidden aria-label="主選單">
      <a class="mi" id="backLink" href="#"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg> 回到行程</a>
      <a class="mi" id="backPlan" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg> 行程規劃</a>
    </nav>
  </div>
  <div class="slidebar">
    <strong class="curview">照片幻燈片</strong>
    <span id="slideInfo" class="muted"></span>
    <span class="grow"></span>
    <button type="button" class="ghost sm" id="slPrev" aria-label="上一張">◀</button>
    <button type="button" class="ghost sm" id="slPlay" aria-label="播放或暫停">▶ 播放</button>
    <button type="button" class="ghost sm" id="slNext" aria-label="下一張">▶</button>
    <button type="button" class="ghost sm" id="slFull" aria-label="全螢幕">全螢幕</button>
  </div>
  <div id="daySel" class="slsel"></div>
  <div class="slidestage"><img id="slideImg" alt=""></div>
  <div class="slidecap" id="slideCap"></div>
  <div class="strip" id="strip"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js"></script>
<script src="js/daysel.js"></script>
<script src="js/nickname.js"></script>
<script src="js/auth.js"></script>
<script src="js/photo-storage.js"></script>
<script src="js/page.js"></script>
<script src="js/slideshow.js"></script>
</body>
</html>
