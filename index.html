<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自由行行程規劃建議</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>自由行行程規劃建議</h1>
    <p>國家、城市、地區與地點都能自己新增。系統會依距離、住宿、航班與所選交通工具估算移動時間，排出每日行程與每人預算概估。</p>
    <span class="demo">示範資料，實際價格與營業時間請以官方資訊為準</span>
  </header>

  <p class="msg" id="boot">載入中…</p>


  <!-- 登入／註冊：views/auth.html -->
  <section id="auth" class="card" hidden></section>

  <div id="app" hidden>
    <div class="topbar">
      <div class="who"><span id="whoEmail"></span><span class="role" id="whoRole"></span><span class="nick" id="nickForm" hidden><input type="text" id="nickIn" maxlength="20" aria-label="暱稱"><button type="button" class="sm" id="nickSave">儲存</button><button type="button" class="ghost sm" id="nickCancel">取消</button><span class="muted" id="nickMsg"></span></span><button type="button" class="ghost sm" id="nickEdit" aria-label="修改暱稱">改暱稱</button></div>
      <div class="tabs">
        <button type="button" class="tab on" data-view="plan">行程規劃</button>
        <button type="button" class="tab" data-view="shared">共享行程</button>
        <button type="button" class="tab" data-view="admin" id="adminTab" hidden>管理後台</button>
        <button type="button" class="tab" id="logout">登出</button>
      </div>
    </div>

    <!-- 行程規劃：views/plan.html -->
    <div id="viewPlan" style="display:flex;flex-direction:column;gap:16px"></div>
    <!-- 共享行程：views/shared.html -->
    <div id="viewShared" hidden style="display:flex;flex-direction:column;gap:16px"></div>
    <!-- 管理後台：views/admin.html -->
    <div id="viewAdmin" hidden style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
  <footer>價格為新台幣概估，含機票、住宿（雙人分攤）、餐飲、交通與景點門票。景點評分為 Google 地圖評分的參考值，可能已變動，請以地圖為準；航班時間請以航空公司公告為準。移動時間依直線距離與各交通工具的平均速度推算，自訂項目的位置為估計值，出發前請以地圖軟體確認。行程儲存在你的帳號中，換裝置登入也看得到。</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js"></script>
<script src="js/nickname.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/pick.js"></script>
<script src="js/schedule.js"></script>
<script src="js/plan-view.js"></script>
<script src="js/plan-events.js"></script>
<script src="js/share.js"></script>
<script src="js/shared-list.js"></script>
<script src="js/admin.js"></script>
<script src="js/main.js"></script>
</body>
</html>
