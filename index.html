<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自由行行程規劃建議</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>自由行行程規劃建議</h1>
    <p>國家、城市、地區與地點都能自己新增。系統會依距離、住宿、航班與所選交通工具估算移動時間，排出每日行程與每人預算概估。</p>
    <span class="demo">示範資料，實際價格與營業時間請以官方資訊為準</span>
  </header>

  <p class="msg" id="boot">載入中…</p>


  <!-- 登入／註冊：views/auth.html -->
  <section id="auth" class="card" hidden></section>

  <div id="app" hidden>
    <div class="topbar">
      <div class="menuwrap">
        <button type="button" class="menubtn" id="menuBtn" aria-label="開啟選單" aria-haspopup="true" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="menupop" id="menuPop" hidden aria-label="主選單">
          <button type="button" class="mi on" data-view="plan">行程規劃</button>
          <button type="button" class="mi" data-view="shared">共享行程</button>
          <div id="adminMenu" hidden>
            <div class="mgroup">管理後台</div>
            <button type="button" class="mi sub" data-view="admin" data-sub="users">使用者與權限</button>
            <button type="button" class="mi sub" data-view="admin" data-sub="data">內建資料</button>
            <button type="button" class="mi sub" data-view="admin" data-sub="trips">所有使用者的行程</button>
            <button type="button" class="mi sub" data-view="admin" data-sub="requests">收錄申請</button>
          </div>
        </nav>
        <strong class="curview" id="curView">行程規劃</strong>
      </div>
      <div class="who"><span id="whoEmail"></span><span class="role" id="whoRole"></span><span class="nick" id="nickForm" hidden><input type="text" id="nickIn" maxlength="20" aria-label="暱稱"><button type="button" class="ib" id="nickSave" title="儲存暱稱" aria-label="儲存暱稱"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button><button type="button" class="ib" id="nickCancel" title="取消" aria-label="取消"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="muted" id="nickMsg"></span></span><button type="button" class="ib" id="nickEdit" title="改暱稱" aria-label="修改暱稱"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3.1-6 7-6 1.5 0 2.8.3 4 .9"/><path d="M15 21l1-4 5-5a1.6 1.6 0 0 1 2.3 2.3l-5 5z" transform="translate(-1.5 -1)"/></svg></button><button type="button" class="ib" id="logout" title="登出" aria-label="登出"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button></div>
    </div>

    <!-- 行程規劃：views/plan.html -->
    <div id="viewPlan" style="display:flex;flex-direction:column;gap:16px"></div>
    <!-- 共享行程：views/shared.html -->
    <div id="viewShared" hidden style="display:flex;flex-direction:column;gap:16px"></div>
    <!-- 管理後台：views/admin.html -->
    <div id="viewAdmin" hidden style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
  <footer>價格為新台幣概估，含機票、住宿（雙人分攤）、餐飲、交通與景點門票。景點評分為 Google 地圖評分的參考值，可能已變動，請以地圖為準；航班時間請以航空公司公告為準。移動時間依直線距離與各交通工具的平均速度推算，自訂項目的位置為估計值，出發前請以地圖軟體確認。行程儲存在你的帳號中，換裝置登入也看得到。</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/core.js"></script>
<script src="js/nickname.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/pick.js"></script>
<script src="js/flights.js"></script>
<script src="js/airports.js"></script>
<script src="js/hours.js"></script>
<script src="js/images.js"></script>
<script src="js/place-map.js"></script>
<script src="js/ferry.js"></script>
<script src="js/schedule.js"></script>
<script src="js/plan-view.js"></script>
<script src="js/plan-events.js"></script>
<script src="js/share.js"></script>
<script src="js/shared-list.js"></script>
<script src="js/requests.js"></script>
<script src="js/admin.js"></script>
<script src="js/admin-transport.js"></script>
<script src="js/main.js"></script>
</body>
</html>
