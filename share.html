<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程分享</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="sTitle">行程分享</h1>
    <p id="sSub">請先登入已註冊的帳號，才能瀏覽這份行程。</p>
  </header>
  <p class="msg" id="boot">載入中…</p>
  <section id="auth" class="card" hidden></section>
  <div id="app" hidden>
    <div class="topbar">
      <div class="who"><span id="whoEmail"></span></div>
      <div class="tabs">
        <a class="tab" id="goSlides" href="#">照片幻燈片</a>
        <button type="button" class="tab" id="logout">登出</button>
      </div>
    </div>
    <section class="card" id="upBox">
      <h2>上傳照片</h2>
      <p class="hint">系統會自動記錄上傳者與上傳時間，並讀取照片的拍攝時間來排序。照片會先縮小再上傳，並移除定位資訊。</p>
      <div class="uprow">
        <input type="file" id="upFiles" accept="image/jpeg,image/png,image/webp" multiple aria-label="選擇照片">
        <select id="upDay" aria-label="這些照片屬於哪一天"></select>
        <input type="text" id="upCap" maxlength="100" placeholder="註解（選填）" aria-label="照片註解">
        <button type="button" id="upGo">上傳</button>
      </div>
      <p class="status" id="upSt"></p>
    </section>
    <section class="card" id="photoBox"><h2>照片 <span class="muted" id="photoCnt"></span></h2><div id="photos" class="photos"></div></section>
    <section id="itin"></section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/page.js"></script>
<script src="js/share-page.js"></script>
</body>
</html>
