<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程分享</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="sTitle">行程分享</h1>
    <p id="sSub">請先登入已註冊的帳號，才能瀏覽這份行程。</p>
  </header>
  <p class="msg" id="boot">載入中…</p>
  <section id="auth" class="card" hidden></section>
  <div id="app" hidden>
    <div class="topbar">
      <div class="who"><span id="whoEmail"></span><span class="nick" id="nickForm" hidden><input type="text" id="nickIn" maxlength="20" aria-label="暱稱"><button type="button" class="sm" id="nickSave">儲存</button><button type="button" class="ghost sm" id="nickCancel">取消</button><span class="muted" id="nickMsg"></span></span><button type="button" class="ghost sm" id="nickEdit" aria-label="修改暱稱">改暱稱</button></div>
      <div class="tabs">
        <a class="tab" id="backPlan" href="index.html">← 返回行程規劃</a>
        <a class="tab" id="goSlides" href="#">照片幻燈片</a>
        <button type="button" class="tab" id="logout">登出</button>
      </div>
    </div>
    <section id="itin"></section>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modalhead"><h2 id="mTitle"></h2><button type="button" class="ghost sm" id="mClose">關閉</button></div>
      <div id="mBody"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="js/core.js"></script>
<script src="js/nickname.js"></script>
<script src="js/auth.js"></script>
<script src="js/page.js"></script>
<script src="js/share-page.js"></script>
</body>
</html>
