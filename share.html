<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行程分享</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="sTitle">行程分享</h1>
    <p id="sSub">請先登入已註冊的帳號，才能瀏覽這份行程。</p>
  </header>
  <p class="msg" id="boot">載入中…</p>
  <section id="auth" class="card" hidden></section>
  <div id="app" hidden>
    <div class="topbar">
      <div class="menuwrap">
        <button type="button" class="menubtn" id="menuBtn" aria-label="開啟選單" aria-haspopup="true" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="menupop" id="menuPop" hidden aria-label="主選單">
          <a class="mi" id="backPlan" href="index.html"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg> 返回行程規劃</a>
          <a class="mi" id="goSlides" href="#"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 8.5v5l4.5-2.5zM8 21h8"/></svg> 照片幻燈片</a>
        </nav>
        <strong class="curview">行程分享</strong>
      </div>
      <div class="who"><span id="whoEmail"></span><span class="nick" id="nickForm" hidden><input type="text" id="nickIn" maxlength="20" aria-label="暱稱"><button type="button" class="ib" id="nickSave" title="儲存暱稱" aria-label="儲存暱稱"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg></button><button type="button" class="ib" id="nickCancel" title="取消" aria-label="取消"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="muted" id="nickMsg"></span></span><button type="button" class="ib" id="nickEdit" title="改暱稱" aria-label="修改暱稱"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.6 3.1-6 7-6 1.5 0 2.8.3 4 .9"/><path d="M15 21l1-4 5-5a1.6 1.6 0 0 1 2.3 2.3l-5 5z" transform="translate(-1.5 -1)"/></svg></button><button type="button" class="ib" id="logout" title="登出" aria-label="登出"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></button></div>
    </div>
    <section id="itin"></section>
  </div>
  <div id="modal" class="modal" hidden>
    <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modalhead"><h2 id="mTitle"></h2><button type="button" class="ib" id="mClose" title="關閉" aria-label="關閉"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div id="mBody"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="js/core.js"></script>
<script src="js/images.js"></script>
<script src="js/daysel.js"></script>
<script src="js/nickname.js"></script>
<script src="js/auth.js"></script>
<script src="js/photo-storage.js"></script>
<script src="js/page.js"></script>
<script src="js/share-page.js"></script>
</body>
</html>
